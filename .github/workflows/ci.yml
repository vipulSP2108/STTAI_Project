name: Revised Voice Helpdesk CI

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify data constraints and the original gold checksum
        run: |
          python -m pip install --quiet pyyaml==6.0.2 numpy==1.26.4 scipy==1.14.1 scikit-learn==1.6.1
          python -m unittest discover -s tests -v
          echo '64b7647b5d0d35733063c77caab122a1a7c24ac6c70b7d476ffbabd9a2448ca9  data/gold_test_set.csv' | sha256sum --check

      - name: Generate a synthetic WAV for sample validation and prediction
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          espeak-ng -w "$RUNNER_TEMP/query.wav" 'Hello, I need help connecting to the campus wireless network.'
          ffmpeg -nostdin -loglevel error -i "$RUNNER_TEMP/query.wav" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/smoke.wav"

      - name: Build the revised CPU runtime without private WAVs
        run: |
          docker build --platform linux/amd64 --target runtime -t voice-helpdesk-asr:ci \
            --build-arg "GIT_COMMIT=$GITHUB_SHA" --build-arg SOURCE_TREE=clean -f code/Dockerfile .

      - name: Validate the sample and make an offline REST prediction
        run: |
          docker run --rm --pull never --network none \
            --mount "type=bind,source=$RUNNER_TEMP/smoke.wav,target=/input.wav,readonly" \
            voice-helpdesk-asr:ci smoke /input.wav
